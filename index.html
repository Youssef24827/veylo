<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veylo — Discover what fits your world</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: white;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .nav-links a {
      text-decoration: none;
      color: #555;
    }

    .nav-links a:first-child {
      color: #111;
      font-weight: 600;
    }

    .hero {
      padding: 70px 40px 35px;
      max-width: 1300px;
      margin: auto;
    }

    .hero p {
      color: #777;
      margin-top: 10px;
      font-size: 16px;
    }

    .feed {
      max-width: 1300px;
      margin: auto;
      padding: 20px 40px 80px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 280px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .product-info {
      padding: 18px;
    }

    .category {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product h2 {
      font-size: 18px;
      margin: 8px 0;
    }

    .price {
      font-weight: 700;
      font-size: 17px;
    }

    .save {
      margin-top: 15px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .save:hover {
      background: #333;
    }

    @media (max-width: 900px) {
      .feed {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      nav {
        padding: 0 20px;
      }

      .nav-links {
        display: none;
      }

      .hero {
        padding: 45px 20px 20px;
      }

      .feed {
        padding: 20px;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">veylo</div>

    <div class="nav-links">
      <a href="#">Discover</a>
      <a href="#">Inspiration</a>
      <a href="#">My Space</a>
    </div>

    <div>♡</div>
  </nav>

  <section class="hero">
    <h1>Find things that fit your world.</h1>
    <p>Discover products. Build your ideas. Make them yours.</p>
  </section>

  <main class="feed">

    <article class="product">
      <div class="product-image">🪑</div>
      <div class="product-info">
        <span class="category">Furniture</span>
        <h2>Minimal Chair</h2>
        <div class="price">129 €</div>
        <button class="save">＋ Add to my space</button>
      </div>
    </article>

    <article class="product">
      <div class="product-image">💡</div>
      <div class="product-info">
        <span class="category">Lighting</span>
        <h2>Orbit Lamp</h2>
        <div class="price">49 €</div>
        <button class="save">＋ Add to my space</button>
      </div>
    </article>

    <article class="product">
      <div class="product-image">🖥️</div>
      <div class="product-info">
        <span class="category">Setup</span>
        <h2>Studio Display</h2>
        <div class="price">299 €</div>
        <button class="save">＋ Add to my space</button>
      </div>
    </article>

    <article class="product">
      <div class="product-image">🛋️</div>
      <div class="product-info">
        <span class="category">Furniture</span>
        <h2>Cloud Sofa</h2>
        <div class="price">699 €</div>
        <button class="save">＋ Add to my space</button>
      </div>
    </article>

  </main>

</body>
</html>
